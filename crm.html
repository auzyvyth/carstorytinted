<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carstory CRM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--bg:#0b0d10;--card:#13161b;--line:#23272e;--text:#eef0f3;--muted:#8b93a1;--accent:#e0a526;--ink:#1a1305;--bad:#e2554f;--ok:#4caf7d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:84px}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{display:flex;justify-content:space-between;align-items:center;height:58px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .brand{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.04em}.brand span{color:var(--accent)}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1115;border-top:1px solid var(--line);z-index:5}
  .tabs button{flex:1;padding:14px 4px 18px;background:none;border:0;color:var(--muted);font:600 13px Outfit,system-ui,sans-serif;cursor:pointer}
  .tabs button.on{color:var(--accent)}
  h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:30px;letter-spacing:.02em;margin:8px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-width:0}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%}
  .btn{padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 14px Outfit,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
  .btn-p{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .btn-s{padding:7px 11px;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .stat b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;font-weight:400;font-variant-numeric:tabular-nums}
  input,select,textarea{width:100%;background:#0e1115;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;font:inherit;font-size:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
  .warn{color:var(--bad);font-size:12px;margin-top:6px}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
  .filters button{flex:none}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet>div{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px 28px}
  .empty{text-align:center;color:var(--muted);padding:36px 12px}
  .lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .lock .card{width:100%;max-width:320px;text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="lock" id="lock" hidden>
  <div class="card">
    <div class="brand" style="margin-bottom:8px"><span>Carstory</span> CRM</div>
    <p class="muted" id="lock-msg">Masukkan PIN</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" style="text-align:center;margin:14px 0;letter-spacing:.4em">
    <button class="btn btn-p" style="width:100%" id="pin-go">Masuk</button>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header><div class="brand"><span>Carstory</span> CRM</div><button class="btn btn-p btn-s" id="new-job">+ Kerja baru</button></header>
    <main id="view"></main>
  </div>
  <nav class="tabs">
    <button data-tab="today">Hari ini</button><button data-tab="jobs">Kerja</button>
    <button data-tab="customers">Pelanggan</button><button data-tab="report">Laporan</button><button data-tab="settings">Tetapan</button>
  </nav>
</div>
<div id="sheet-root"></div>

<script>
// Storage: this device's browser only. Back up from Tetapan regularly —
// clearing browser data wipes it. Upgrade path to a shared DB is in README.md.
const S = window.SHOP, J = window.JPJ, KEY = 'carstory_crm_v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = (n) => 'RM' + Math.round(Number(n) || 0).toLocaleString('en-MY');
const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addYears = (d, y) => { const x = new Date(d); x.setFullYear(x.getFullYear() + y); return x.toISOString().slice(0, 10); };
// Malaysian numbers: 012-345 6789 -> 60123456789
const normPhone = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '6' + d; return d; };
const wa = (phone, text) => normPhone(phone).length >= 10 ? `https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}` : '';

const STATUS = {
  enquiry: { label: 'Tanya harga', color: '#8b93a1' },
  booked:  { label: 'Tempah',      color: '#5b9bd5' },
  done:    { label: 'Siap',        color: '#e0a526' },
  paid:    { label: 'Dibayar',     color: '#4caf7d' },
  lost:    { label: 'Tak jadi',    color: '#e2554f' },
};

let db = load();
function load() {
  try { return Object.assign({ jobs: [], pin: '' }, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return { jobs: [], pin: '' }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
const film = (id) => S.films.find(f => f.id === id) || S.films[0];
const balance = (j) => Math.max(0, (Number(j.price) || 0) - (Number(j.paidAmount) || 0));
const warrantyEnd = (j) => j.date ? addYears(j.date, film(j.film).warrantyYears) : '';

// ---- Follow-ups: every rule returns who to message today and a drafted text.
// A human reads and presses send in WhatsApp; nothing is sent automatically.
function followUps() {
  const t = today(), out = [];
  for (const j of db.jobs) {
    const first = (j.name || '').split(' ')[0] || 'tuan/puan';
    if (j.status === 'enquiry' && daysBetween(j.createdAt, t) >= 2 && !j.fu?.quote)
      out.push({ j, key: 'quote', why: 'Tanya harga, belum tempah', text: `Salam ${first}, ini dari ${S.name}. Masih berminat nak pasang tinted untuk ${j.car || 'kereta'} tuan/puan? Boleh saya simpan slot minggu ni?` });
    if (j.status === 'booked' && j.date && [0, 1].includes(daysBetween(t, j.date)) && !j.fu?.remind)
      out.push({ j, key: 'remind', why: j.date === t ? 'Temujanji hari ini' : 'Temujanji esok', text: `Salam ${first}, peringatan temujanji tinted di ${S.name} pada ${j.date}${j.time ? ' jam ' + j.time : ''}. Alamat: ${S.address}. Jumpa nanti!` });
    if (['done', 'paid'].includes(j.status) && balance(j) > 0 && !j.fu?.balance)
      out.push({ j, key: 'balance', why: `Baki ${rm(balance(j))} belum bayar`, text: `Salam ${first}, terima kasih pasang tinted di ${S.name}. Baki bayaran ${rm(balance(j))}. Boleh maklumkan bila selesai ya.` });
    if (['done', 'paid'].includes(j.status) && j.date && daysBetween(j.date, t) >= 3 && daysBetween(j.date, t) <= 21 && !j.fu?.thanks)
      out.push({ j, key: 'thanks', why: 'Minta review & kenalan', text: `Salam ${first}, macam mana tinted ${j.car || ''} setakat ni? Kalau puas hati, boleh tinggalkan review di Google/Facebook kami. Ada kawan nak pasang, suruh sebut nama ${first} ya.` });
  }
  const order = { remind: 0, balance: 1, quote: 2, thanks: 3 };
  return out.sort((a, b) => order[a.key] - order[b.key]);
}

// ---- Views
let tab = 'today', jobFilter = 'active';
function go(t) { tab = t; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); render(); }
function statusTag(s) { const c = STATUS[s]; return `<span class="tag"><span class="dot" style="background:${c.color}"></span>${c.label}</span>`; }
function jobCard(j) {
  return `<div class="card" data-job="${j.id}" style="cursor:pointer">
    <div class="row"><b>${esc(j.name) || 'Tanpa nama'}</b>${statusTag(j.status)}</div>
    <div class="muted" style="margin-top:4px">${esc(j.car)} ${j.plate ? '· ' + esc(j.plate) : ''} · ${esc(film(j.film).name)}</div>
    <div class="row muted" style="margin-top:6px"><span>${j.date ? esc(j.date) + (j.time ? ' ' + esc(j.time) : '') : 'Tiada tarikh'}</span><span>${j.price ? rm(j.price) : ''}${balance(j) && j.status !== 'enquiry' ? ' · baki ' + rm(balance(j)) : ''}</span></div>
  </div>`;
}

function render() {
  const v = $('view');
  if (tab === 'today') {
    const t = today(), todays = db.jobs.filter(j => j.date === t && j.status === 'booked');
    const fu = followUps();
    v.innerHTML = `<h2>Hari ini</h2>
      <div class="muted" style="margin-bottom:8px">Kereta masuk hari ini (${todays.length})</div>
      ${todays.map(jobCard).join('') || '<div class="card muted">Tiada temujanji hari ini.</div>'}
      <h2 style="margin-top:20px">Perlu mesej (${fu.length})</h2>
      ${fu.map((f, i) => `<div class="card">
        <div class="row"><b>${esc(f.j.name)}</b><span class="tag">${esc(f.why)}</span></div>
        <div class="muted" style="margin:8px 0 10px">${esc(f.text)}</div>
        <div class="row" style="justify-content:flex-end;gap:8px">
          <button class="btn btn-s" data-skip="${i}">Abaikan</button>
          ${wa(f.j.phone, f.text) ? `<button class="btn btn-p btn-s" data-send="${i}">Buka WhatsApp</button>` : '<span class="muted">Tiada no. telefon</span>'}
        </div></div>`).join('') || '<div class="empty">Semua pelanggan dah diurus.</div>'}`;
    const act = (i) => { const f = fu[i]; f.j.fu = { ...(f.j.fu || {}), [f.key]: t }; save(); };
    v.querySelectorAll('[data-send]').forEach(b => b.onclick = () => { const f = fu[b.dataset.send]; window.open(wa(f.j.phone, f.text), '_blank', 'noopener'); act(b.dataset.send); render(); });
    v.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { act(b.dataset.skip); render(); });
  }
  if (tab === 'jobs') {
    const fs = { active: ['enquiry', 'booked', 'done'], all: Object.keys(STATUS), ...Object.fromEntries(Object.keys(STATUS).map(k => [k, [k]])) };
    const list = db.jobs.filter(j => fs[jobFilter].includes(j.status)).sort((a, b) => (b.date || b.createdAt).localeCompare(a.date || a.createdAt));
    v.innerHTML = `<h2>Kerja</h2><div class="filters">
      ${[['active', 'Aktif'], ...Object.entries(STATUS).map(([k, s]) => [k, s.label]), ['all', 'Semua']].map(([k, l]) => `<button class="btn btn-s${jobFilter === k ? ' btn-p' : ''}" data-f="${k}">${l}</button>`).join('')}
      </div>${list.map(jobCard).join('') || '<div class="empty">Tiada kerja di sini.</div>'}`;
    v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { jobFilter = b.dataset.f; render(); });
  }
  if (tab === 'customers') {
    const byPhone = {};
    for (const j of db.jobs) { const k = normPhone(j.phone) || j.id; (byPhone[k] ||= []).push(j); }
    const rows = Object.values(byPhone).map(js => ({ js, last: js.map(j => j.date || '').sort().pop(), spent: js.filter(j => j.status === 'paid' || j.status === 'done').reduce((s, j) => s + (Number(j.price) || 0), 0) }))
      .sort((a, b) => (b.last || '').localeCompare(a.last || ''));
    v.innerHTML = `<h2>Pelanggan (${rows.length})</h2><input id="cq" placeholder="Cari nama, telefon, plat"><div id="clist" style="margin-top:12px"></div>`;
    const draw = (q) => { q = q.toLowerCase(); $('clist').innerHTML = rows.filter(r => r.js.some(j => [j.name, j.phone, j.plate, j.car].join(' ').toLowerCase().includes(q))).map(r => {
      const j = r.js[0], w = r.js.filter(x => x.date && ['done', 'paid'].includes(x.status)).map(warrantyEnd).sort().pop();
      return `<div class="card" data-job="${j.id}" style="cursor:pointer"><div class="row"><b>${esc(j.name)}</b><span class="muted">${r.js.length} kerja · ${rm(r.spent)}</span></div>
        <div class="muted" style="margin-top:4px">${esc(j.phone)} · ${r.js.map(x => esc(x.plate || x.car)).filter(Boolean).join(', ')}${w ? ' · waranti hingga ' + w : ''}</div></div>`; }).join('') || '<div class="empty">Tiada pelanggan.</div>'; bindCards(); };
    $('cq').oninput = (e) => draw(e.target.value); draw('');
  }
  if (tab === 'report') {
    const m = today().slice(0, 7);
    const done = db.jobs.filter(j => ['done', 'paid'].includes(j.status) && (j.date || '').startsWith(m));
    const rev = done.reduce((s, j) => s + (Number(j.price) || 0), 0), got = done.reduce((s, j) => s + (Number(j.paidAmount) || 0), 0);
    const enq = db.jobs.filter(j => (j.createdAt || '').startsWith(m)).length;
    const owed = db.jobs.filter(j => ['done', 'paid'].includes(j.status)).reduce((s, j) => s + balance(j), 0);
    const byFilm = S.films.map(f => ({ f, n: done.filter(j => j.film === f.id).length }));
    v.innerHTML = `<h2>Laporan bulan ini</h2><div class="stats">
      <div class="card stat"><span class="muted">Jualan</span><b>${rm(rev)}</b></div>
      <div class="card stat"><span class="muted">Diterima</span><b>${rm(got)}</b></div>
      <div class="card stat"><span class="muted">Kereta siap</span><b>${done.length}</b></div>
      <div class="card stat"><span class="muted">Purata / kereta</span><b>${done.length ? rm(rev / done.length) : '-'}</b></div>
      <div class="card stat"><span class="muted">Pertanyaan baru</span><b>${enq}</b></div>
      <div class="card stat"><span class="muted">Hutang pelanggan (semua)</span><b>${rm(owed)}</b></div></div>
      <div class="card">${byFilm.map(({ f, n }) => `<div class="row" style="padding:6px 0"><span>${esc(f.name)}</span><b>${n}</b></div>`).join('')}</div>`;
  }
  if (tab === 'settings') {
    v.innerHTML = `<h2>Tetapan</h2>
      <div class="card"><b>Backup</b><p class="muted" style="margin:6px 0 12px">Data disimpan dalam telefon/komputer ini sahaja. Muat turun backup setiap minggu.</p>
        <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">
          <button class="btn btn-s" id="exp">Muat turun backup</button><button class="btn btn-s" id="csv">Eksport CSV (Excel)</button>
          <label class="btn btn-s" style="margin:0;color:var(--text);font-size:13px">Pulihkan backup<input type="file" id="imp" accept=".json" hidden></label></div></div>
      <div class="card"><b>PIN</b><p class="muted" style="margin:6px 0 12px">Menghalang orang lain buka CRM di peranti ini. Kosongkan untuk buang PIN.</p>
        <div class="row"><input id="newpin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN baru (4-6 angka)"><button class="btn btn-s" id="setpin">Simpan</button></div></div>`;
    $('exp').onclick = () => download(`carstory-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
    $('csv').onclick = () => {
      const cols = ['date', 'time', 'status', 'name', 'phone', 'car', 'plate', 'film', 'price', 'paidAmount', 'notes'];
      const csv = [cols.join(','), ...db.jobs.map(j => cols.map(c => `"${String(j[c] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
      download(`carstory-${today()}.csv`, csv, 'text/csv');
    };
    $('imp').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.jobs)) throw 0;
        if (confirm(`Ganti data sekarang (${db.jobs.length} kerja) dengan backup (${d.jobs.length} kerja)?`)) { db = { ...db, jobs: d.jobs }; save(); render(); } }
      catch { alert('Fail backup tidak sah.'); }
    };
    $('setpin').onclick = async () => { const p = $('newpin').value.trim(); if (p && !/^\d{4,6}$/.test(p)) return alert('PIN mesti 4-6 angka.'); db.pin = p ? await hash(p) : ''; save(); alert(p ? 'PIN disimpan.' : 'PIN dibuang.'); };
  }
  bindCards();
}
function bindCards() { document.querySelectorAll('[data-job]').forEach(c => c.onclick = () => openJob(db.jobs.find(j => j.id === c.dataset.job))); }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }
async function hash(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('carstory:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

// ---- Job sheet (create + edit)
function openJob(j) {
  const isNew = !j;
  j = j ? { ...j } : { id: crypto.randomUUID(), status: 'enquiry', film: S.films[0].id, size: S.carSizes[0].id, createdAt: today(), vlt: {} };
  const opt = (list, val, lab) => list.map(o => `<option value="${o.id}"${o.id === val ? ' selected' : ''}>${esc(lab(o))}</option>`).join('');
  $('sheet-root').innerHTML = `<div class="sheet" id="sh"><div>
    <div class="row"><h2>${isNew ? 'Kerja baru' : 'Kemaskini kerja'}</h2><button class="btn btn-s" id="x">Tutup</button></div>
    <label>Status</label><select id="f-status">${Object.entries(STATUS).map(([k, s]) => `<option value="${k}"${k === j.status ? ' selected' : ''}>${s.label}</option>`).join('')}</select>
    <div class="g2"><div><label>Nama</label><input id="f-name" value="${esc(j.name)}"></div><div><label>Telefon</label><input id="f-phone" type="tel" value="${esc(j.phone)}" placeholder="012-345 6789"></div></div>
    <div class="g2"><div><label>Kereta</label><input id="f-car" value="${esc(j.car)}" placeholder="Myvi 2022"></div><div><label>No. plat</label><input id="f-plate" value="${esc(j.plate)}"></div></div>
    <div class="g2"><div><label>Saiz</label><select id="f-size">${opt(S.carSizes, j.size, o => o.label)}</select></div><div><label>Filem</label><select id="f-film">${opt(S.films, j.film, o => o.name)}</select></div></div>
    <label>VLT diukur selepas pasang (% cahaya tembus)</label>
    <div class="g3"><input id="v-ws" type="number" placeholder="Depan" value="${esc(j.vlt?.ws)}"><input id="v-fs" type="number" placeholder="Sisi depan" value="${esc(j.vlt?.fs)}"><input id="v-rear" type="number" placeholder="Belakang" value="${esc(j.vlt?.rear)}"></div>
    <div class="warn" id="vwarn"></div>
    <div class="g2"><div><label>Tarikh</label><input id="f-date" type="date" value="${esc(j.date)}"></div><div><label>Masa</label><input id="f-time" type="time" value="${esc(j.time)}"></div></div>
    <div class="g2"><div><label>Harga (RM)</label><input id="f-price" type="number" inputmode="decimal" value="${esc(j.price)}"></div><div><label>Sudah dibayar (RM)</label><input id="f-paid" type="number" inputmode="decimal" value="${esc(j.paidAmount)}"></div></div>
    <label>Nota</label><textarea id="f-notes" rows="2">${esc(j.notes)}</textarea>
    <div class="row" style="margin-top:16px;gap:8px">
      ${isNew ? '<span></span>' : '<button class="btn btn-s" id="del" style="color:var(--bad)">Padam</button>'}
      <button class="btn btn-p" id="sv">Simpan</button></div>
  </div></div>`;
  document.body.style.overflow = 'hidden';
  const close = () => { $('sheet-root').innerHTML = ''; document.body.style.overflow = ''; };
  const checkVlt = () => {
    const w = [], ws = $('v-ws').value, fs = $('v-fs').value;
    if (ws !== '' && Number(ws) < J.windscreen) w.push(`Cermin depan ${ws}% di bawah had JPJ ${J.windscreen}%`);
    if (fs !== '' && Number(fs) < J.frontSide) w.push(`Sisi depan ${fs}% di bawah had JPJ ${J.frontSide}%`);
    $('vwarn').textContent = w.join(' · ');
  };
  ['v-ws', 'v-fs'].forEach(id => $(id).oninput = checkVlt); checkVlt();
  $('x').onclick = close; $('sh').onclick = (e) => { if (e.target.id === 'sh') close(); };
  if (!isNew) $('del').onclick = () => { if (confirm('Padam kerja ini?')) { db.jobs = db.jobs.filter(x => x.id !== j.id); save(); close(); render(); } };
  $('sv').onclick = () => {
    const val = (id) => $(id).value.trim();
    Object.assign(j, { status: val('f-status'), name: val('f-name'), phone: val('f-phone'), car: val('f-car'), plate: val('f-plate').toUpperCase(),
      size: val('f-size'), film: val('f-film'), date: val('f-date'), time: val('f-time'), price: val('f-price'), paidAmount: val('f-paid'), notes: val('f-notes'),
      vlt: { ws: val('v-ws'), fs: val('v-fs'), rear: val('v-rear') } });
    if (!j.name && !j.phone) return alert('Isi nama atau telefon.');
    if (j.status === 'booked' && !j.date) return alert('Kerja yang ditempah perlukan tarikh.');
    const i = db.jobs.findIndex(x => x.id === j.id); if (i >= 0) db.jobs[i] = j; else db.jobs.push(j);
    save(); close(); render();
  };
}

// ---- Boot
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('new-job').onclick = () => openJob(null);
function unlock() { $('lock').hidden = true; $('app').hidden = false; go('today'); }
if (db.pin) {
  $('lock').hidden = false;
  const tryPin = async () => { if (await hash($('pin').value) === db.pin) unlock(); else { $('lock-msg').textContent = 'PIN salah'; $('pin').value = ''; } };
  $('pin-go').onclick = tryPin; $('pin').onkeydown = (e) => e.key === 'Enter' && tryPin();
} else unlock();
</script>
</body>
</html>
